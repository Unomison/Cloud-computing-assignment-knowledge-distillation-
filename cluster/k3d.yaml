apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloud-cluster
servers: 1
agents: 1
image: rancher/k3s:v1.28.8-k3s1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8333:8333
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs: []
  kubeconfig:
    updateExisting: true
    switchMode: true
